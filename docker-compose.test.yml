version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: omniroute
      POSTGRES_PASSWORD: omniroute
      POSTGRES_DB: omniroute_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniroute -d omniroute_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
